<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rpm lathe/mill - checks</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 1rem; }
  pre { white-space: pre-wrap; }
  .pass { color: #0a6; } .fail { color: #c00; font-weight: 600; }
  iframe { width: 430px; height: 1100px; border: 1px solid #ccc; }
</style>
</head>
<body>
<h1>RPM page: lathe and mill modes</h1>
<pre id="out">running...</pre>
<iframe id="app" src="../index.html"></iframe>
<script type="module">
// The RPM page is speed only. It changes what the main diameter means, which
// diameter label is shown, and whether a separate workpiece field appears. It
// must never report a feed in either mode, and it must not ask for a flute
// count, because surface speed and feed are independent axes.
const results = [];
const check = (name, got, want) => {
  const ok = String(got) === String(want);
  results.push({ name, got, want, ok });
};
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

const frame = document.getElementById('app');
let waited = 0;
while (waited < 10000) {
  const doc = frame.contentDocument;
  if (doc && doc.querySelector('#nav-list .nav-item')) break;
  await sleep(150);
  waited += 150;
}
const d = frame.contentDocument;
const W = frame.contentWindow;
const errs = [];
W.addEventListener('error', (e) => errs.push(`${e.message} @ ${e.filename}:${e.lineno}`));

d.querySelector('.nav-item[data-calc="rpm"]').click();
await sleep(450);
const root = () => d.querySelector('.calc-slot:not([hidden])');
const rowLabels = () => [...root().querySelectorAll('.res-row')]
  .map((r) => (r.querySelector('.res-label') || r).textContent.replace(/\s+/g, ' ').trim());
const rowValue = (needle) => {
  const r = [...root().querySelectorAll('.res-row')].find((x) => x.textContent.includes(needle));
  return r ? r.textContent.replace(/\s+/g, ' ').trim() : null;
};
const hasField = (name) => Boolean(root().querySelector(`[data-f="${name}"]`));
const fieldLabel = (name) => {
  // The input sits inside <label class="field">, with the text in a
  // .field-label span, so there is no nested label element to query.
  const el = root().querySelector(`[data-f="${name}"]`);
  const wrap = el && el.closest('.field');
  const lbl = wrap && wrap.querySelector('.field-label');
  return lbl ? lbl.textContent.trim() : null;
};
const setMode = async (m) => {
  root().querySelector(`.seg[data-value="${m}"]`).click();
  await sleep(450);
};
const setField = async (name, v) => {
  const el = root().querySelector(`[data-f="${name}"]`);
  el.value = v;
  el.dispatchEvent(new W.Event('input', { bubbles: true }));
  await sleep(320);
};
const setSelect = async (name, v) => {
  const el = root().querySelector(`select[data-f="${name}"]`);
  el.value = v;
  el.dispatchEvent(new W.Event('change', { bubbles: true }));
  await sleep(380);
};

// The page must not depend on saved state from a previous visit, so clear it.
try { W.localStorage.removeItem('mechcalc:calcState:rpm'); } catch { /* ignore */ }

// --- default is lathe, and the working diameter is called the part diameter ---
check('default mode is lathe', root().querySelector('.seg[data-value="lathe"]').classList.contains('is-active'), true);
check('lathe labels the working diameter Part diameter', fieldLabel('dia'), 'Part diameter');
check('lathe shows no separate workpiece field', hasField('partDia'), false);
check('lathe does not report a separate workpiece speed', rowLabels().some((l) => /Speed at the/.test(l)), false);

// The page reports speed and nothing else. No feed, and no flute count.
check('lathe with no material reports no feed', rowLabels().some((l) => /Feed per revolution/.test(l)), false);
check('lathe with no material still reports the speed', /Spindle speed/.test(rowLabels().join(' ')), true);
check('lathe never asks for a flute count', hasField('flutes'), false);
check('the half inch mild steel default lands on 1910 rpm', /1,909|1,910/.test(rowValue('Spindle speed') || ''), true);
check('the default cutting speed reads back as 250 SFM', /250\.0SFM/.test(rowValue('Cutting speed') || ''), true);

// --- mill mode flips the label and brings the workpiece field back ---
await setMode('mill');
check('mill labels the working diameter Tool diameter', fieldLabel('dia'), 'Tool diameter');
check('mill shows the workpiece field', hasField('partDia'), true);
check('mill without a workpiece omits the workpiece speed', rowLabels().some((l) => /Speed at the/.test(l)), false);
check('mill never asks for a flute count', hasField('flutes'), false);
check('mill with no material still reports no feed', /Feed per revolution/.test(rowLabels().join(' ')), false);

await setField('partDia', '4');
check('mill with a workpiece reports its speed', /Speed at the workpiece/.test(rowLabels().join(' ')), true);
check('4 in workpiece at 1910 rpm is 2000 SFM', /2,000\.0SFM/.test(rowValue('Speed at the workpiece') || ''), true);

// --- a loaded material sets the speed, never a feed ---
await setMode('lathe');
check('returning to lathe hides the workpiece field', hasField('partDia'), false);
check('returning to lathe restores the part diameter label', fieldLabel('dia'), 'Part diameter');

await setSelect('matId', 'bronze-660');
check('lathe with a material still reports no feed', /Feed per revolution/.test(rowLabels().join(' ')), false);
check('the material drove the cutting speed', /60\.0SFM/.test(rowValue('Cutting speed') || ''), true);

await setSelect('matId', 'custom');
check('dropping back to custom still reports no feed', rowLabels().some((l) => /Feed per revolution/.test(l)), false);

// The page must not tell the user to size a feed off any diameter, and must not
// mention chip load or IPT at all.
await setSelect('matId', 'bronze-660');
check('the lathe page never suggests sizing feed off the part diameter', /chip load is scaled from the tool diameter/.test(root().textContent), false);
check('the page mentions no chip load at all', /chip load/i.test(root().textContent), false);
check('the page mentions no IPT at all', /\bIPT\b/.test(root().textContent), false);
check('the page points feed work at the Table Feed page', /Table Feed page/.test(root().textContent), true);

const failed = results.filter((r) => !r.ok);
const lines = results.map((r) => `${r.ok ? 'pass' : 'FAIL'}  ${r.name}${r.ok ? '' : `\n        got  ${r.got}\n        want ${r.want}`}`);
lines.push('');
lines.push(failed.length ? `${failed.length} of ${results.length} checks failed` : `all ${results.length} checks passed`);
lines.push(`errors: ${errs.length ? errs.join(' | ') : 'none'}`);
const out = document.getElementById('out');
out.textContent = lines.join('\n');
out.className = failed.length ? 'fail' : 'pass';
document.title = failed.length ? 'FAIL rpm lathe/mill' : 'PASS rpm lathe/mill';
</script>
</body>
</html>
